# Extends Nixpacks' auto-detected Node setup with Python + a headless
# Chromium — required at runtime by DataImportService, which shells out to
# backend/scripts/data/refresh_ug.py (pdfplumber) and refresh_pg.py
# (Playwright) to power the admin panel's "Refresh college data" tool. See
# that module's docstring and scripts/data/README.md.
#
# Setting `nixPkgs` here REPLACES Nixpacks' auto-detected setup phase
# entirely rather than adding to it (learned the hard way: an earlier
# version of this file that listed only python packages produced a build
# with no `npm` at all — "npm: command not found"). nodejs must be listed
# explicitly alongside python. Use nodejs_22, not nodejs_20 — also learned
# the hard way: @supabase/supabase-js's realtime-js client requires
# Node's *native* WebSocket support (added in Node 22) and throws
# "Node.js 20 detected without native WebSocket support" on startup
# otherwise, crash-looping the whole app even though package.json's
# engines field only requires >=20.11. The actual pip/playwright install
# commands live in railway.toml's buildCommand instead of a
# [phases.install] block here, since railway.toml's buildCommand takes
# precedence over (and would otherwise conflict with) a nixpacks-defined
# install phase — this file's only job is making
# `node`/`npm`/`python3`/`pip` exist for that command.
[phases.setup]
nixPkgs = ["nodejs_22", "python311", "python311Packages.pip"]
