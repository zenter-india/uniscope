[build]
builder = "NIXPACKS"
# Python step powers the admin panel's "Refresh college data" tool
# (DataImportService shells out to scripts/data/refresh_*.py) — see
# nixpacks.toml for where python3/pip come from, and
# scripts/data/README.md for what these scripts do. `--break-system-packages`
# is needed because Nixpacks' Python isn't in a venv; `playwright install
# --with-deps chromium` pulls a headless browser (~300MB) purely for
# refresh_pg.py, since MCC's PG source has no static file to download.
buildCommand = "npm install --include=dev && npx prisma generate && npm run build && pip install --break-system-packages -r scripts/data/requirements.txt && python3 -m playwright install --with-deps chromium"

[deploy]
# TEMP (2026-09-09): 20260909210000's first deploy failed mid-migration (a
# unique-constraint hit that the rewrite fixes) and Prisma parks a failed
# migration, blocking every deploy. `resolve --rolled-back` clears it so the
# fixed migration re-runs; `|| true` makes it a no-op once applied. Revert
# this line to the plain `npx prisma migrate deploy && node dist/main.js` on
# the next backend change.
startCommand = "npx prisma migrate resolve --rolled-back 20260909210000_dedup_universities_same_or_null_city || true; npx prisma migrate deploy && node dist/main.js"
healthcheckPath = "/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
