# DEPRECATED — 2026-06-14
# MedConnect has moved to cloud-first infrastructure.
# This file is kept for historical reference only.
# DO NOT USE for active development.
#
# Use instead:
#   Database: Supabase (medconnect-dev / medconnect-qa / medconnect-prod)
#   Redis:    Upstash Redis
#   OTP:      Twilio Verify
#   Storage:  Supabase Storage

services:
  postgres:
    image: postgres:16-alpine
    container_name: medconnect-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: medconnect
      POSTGRES_PASSWORD: medconnect
      POSTGRES_DB: medconnect_dev
    volumes:
      - medconnect_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medconnect -d medconnect_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: medconnect-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  medconnect_pg_data:
