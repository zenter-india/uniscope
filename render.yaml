services:
  - type: web
    name: uniscope-backend
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install --include=dev && npx prisma generate --schema=backend/prisma/schema.prisma && npm run build --workspace=backend
    startCommand: npx prisma migrate deploy --schema=backend/prisma/schema.prisma && node backend/dist/main.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PREFIX
        value: api/v1
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_ACCESS_TTL
        value: "900"
      - key: JWT_REFRESH_TTL
        value: "604800"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: REDIS_URL
        sync: false
      # Still `mock` deliberately — flip to `twilio` or `msg91` only once
      # that provider's creds below are the real, live-tested values (see
      # CLAUDE.md "OTP integration"). Changing this value alone doesn't
      # touch a value already set directly in the Render dashboard for the
      # same key — update it there too, not just here.
      - key: OTP_PROVIDER_TYPE
        value: mock
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_VERIFY_SERVICE_SID
        sync: false
      - key: MSG91_AUTH_KEY
        sync: false
      - key: MSG91_TEMPLATE_ID
        sync: false
      - key: STREAM_API_KEY
        sync: false
      - key: STREAM_API_SECRET
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: AGORA_APP_ID
        sync: false
      - key: AGORA_APP_CERTIFICATE
        sync: false
      # Optional — unset means new-lead/daily-digest Slack alerts are
      # silently skipped rather than the app failing to start.
      - key: SLACK_WEBHOOK_URL
        sync: false
      - key: FIREBASE_PROJECT_ID
        value: uniscope-83eeb
      - key: FIREBASE_DISABLED
        value: "false"
      - key: FIREBASE_SERVICE_ACCOUNT_KEY_PATH
        value: /etc/secrets/firebase-service-account.json
