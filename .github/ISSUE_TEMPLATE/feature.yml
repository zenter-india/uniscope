name: Feature
description: Propose a new product or engineering feature
title: "[Feature]: "
labels: ["feature"]
body:
  - type: markdown
    attributes:
      value: |
        Use this template for new product capabilities or significant engineering work.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What problem does this solve?
      placeholder: As a prospective medical student, I want to...
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How do we know this is done?
      placeholder: |
        - [ ] Criterion 1
        - [ ] Criterion 2
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - mobile
        - backend
        - admin
        - infrastructure
        - docs
        - other
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Additional context
      description: Designs, links, dependencies
