name: Task
description: Engineering or operational task (non-feature work)
title: "[Task]: "
labels: ["task"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Task summary
      description: What needs to be done?
    validations:
      required: true

  - type: textarea
    id: checklist
    attributes:
      label: Checklist
      placeholder: |
        - [ ] Step 1
        - [ ] Step 2
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - mobile
        - backend
        - admin
        - infrastructure
        - docs
        - devops
        - other
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Links, blockers, owners
